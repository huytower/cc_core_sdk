name: cc_sdk_ui
description: Design system of the SDK - tokens, adaptive layout (CcScale, CcWindowSizeClass) and generic widgets. No dependency on cc_sdk or platform plugins.
version: 2.0.0
publish_to: none
repository: https://github.com/huytower/cc_core_sdk
homepage: https://github.com/huytower/cc_core_sdk

environment:
  sdk: '^3.12.0'
  flutter: '^3.44.3'

resolution: workspace

dependencies:
  custom_refresh_indicator: ^4.0.2
  flutter:
    sdk: flutter

  keyboard_dismisser: ^3.0.0

  shimmer_animation: ^2.2.2+1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  build_runner: ^2.15.1
