name: cc_sdk_firebase
description: Firebase implementations of cc_sdk capability interfaces (analytics, crash reporting, app attestation, ...).
version: 2.0.0
publish_to: none
repository: https://github.com/huytower/cc_core_sdk
homepage: https://github.com/huytower/cc_core_sdk

environment:
  sdk: '^3.12.0'
  flutter: '^3.44.3'

resolution: workspace

dependencies:
  cc_sdk:
    path: ../cc_sdk
  firebase_analytics: ^13.0.1
  firebase_app_check: ^0.5.1
  firebase_crashlytics: ^6.0.1
  flutter:
    sdk: flutter
  get_it: ^9.2.1
  injectable: ^3.0.0

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
