name: cc_sdk_phone
description: Phone number capability for cc_sdk - CcPhoneNumberValidator backed by phone_numbers_parser.
version: 2.0.0
publish_to: none
repository: https://github.com/huytower/cc_core_sdk
homepage: https://github.com/huytower/cc_core_sdk

environment:
  sdk: '^3.12.0'
  flutter: '^3.44.3'

resolution: workspace

dependencies:
  cc_sdk:
    path: ../cc_sdk
  flutter:
    sdk: flutter
  get_it: ^9.2.1
  injectable: ^3.0.0
  phone_numbers_parser: ^9.0.25

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  injectable_generator: ^3.1.3
